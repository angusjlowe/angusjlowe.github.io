{{ define "main" }}
    <!-- Main content -->
    <div class="container pt-2">
        <div class="row">
            <div class="col-md-3">
                <br>
            </div>
            <article class="col-md-6 prose post">
                <h1>{{ .Title }}</h1>
                {{ .Content }}
                <div class="page-footer">
                    <a href="#top">Back to top</a> &middot; <a href="{{ .CurrentSection.RelPermalink }}">All notes</a>
                </div>
            </article>
        </div>
    </div>
{{ end }}

{{ define "scripts" }}
    {{ partial "mathjax.html" . }}
{{ end }}
